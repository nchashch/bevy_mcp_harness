[package]
name = "bevy_mcp_harness"
version = "0.4.0"
edition = "2024"
description = "Localhost MCP + BRP tool surface for agent-driven QA playtesting of Bevy apps"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nchashch/bevy_mcp_harness"
documentation = "https://docs.rs/bevy_mcp_harness"
keywords = ["bevy", "mcp", "testing", "playtesting", "gamedev"]
categories = ["game-development", "development-tools::testing"]

# `default-features = false`: the harness must not drag winit/wayland/X11 system deps into
# hosts whose bevy is minimal (a headless dedicated server with the harness as a dependency
# unifies features with the harness's — default features made `wayland-sys`'s build script
# demand libwayland on a GPU-less CI runner). The feature list below is what the crate's code
# actually touches; hosts enable the rest (winit, render pipelines, …) themselves.
# The p19-style render-debug views (depth/normals/motion vectors — the F1 overlay of
# bevy_dev_tools) as a screenshot `debug_view` parameter. Off by default: it pulls
# `bevy_dev_tools` (and its render-pipeline deps) into host builds that enable it.
[features]
render_debug = [
    "dep:bevy_dev_tools",
    "bevy/bevy_dev_tools",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
]
# Physics debug views (`physics_debug`): NOT on this line. avian3d 0.7 — the newest release —
# requires bevy ^0.19, so no avian3d release can compile against bevy 0.20 and the feature is
# removed until avian3d updates (the `physics` debug_view then errors cleanly instead of
# pulling an incompatible dependency graph).

[dependencies]
# `bevy_remote` is the BRP data layer; `serialize` lets `game/keyboard` deserialize `KeyCode`
# variants by name through KeyCode's own serde impl.
bevy = { version = "0.20", default-features = false, features = [
    "bevy_camera",
    "bevy_log",
    "bevy_mesh",
    "bevy_picking",
    "bevy_remote",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "serialize",
] }
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
base64 = "0.22"
# Same 0.25 line bevy_render pulls transitively for screenshot encoding — declared so captures
# can be cropped (`imageops::crop_imm`) and PNG-encoded here.
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
serde = "1"
schemars = "1.0"
# Render-debug views (`render_debug` feature): `bevy_dev_tools`' overlay reads prepass/gbuffer
# textures, so it needs the render-pipeline crates — none of which pull winit/wayland.
bevy_dev_tools = { version = "0.20", optional = true }

# Examples build against the full bevy feature set (the `--render` branch uses `DefaultPlugins`)
# — dev-dependency features only affect examples/tests, never host builds of the lib.
[dev-dependencies]
bevy = { version = "0.20" }
proptest = "1"
